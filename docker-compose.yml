# Local source build. Shared runtime settings live in the build-neutral common
# file and are inherited by both local and published-image deployments.
services:
  web:
    extends:
      file: docker-compose.common.yml
      service: web
    build: .
    image: whois-go:latest

  redis:
    extends:
      file: docker-compose.common.yml
      service: redis

networks:
  app-tier:
    driver: bridge

volumes:
  redis_data:
  whois_data:
