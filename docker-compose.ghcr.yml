# Published-image deployment. This leaf never inherits from the local-build
# definition, so `docker compose config` cannot reintroduce a build rule.
services:
  web:
    extends:
      file: docker-compose.common.yml
      service: web
    image: ghcr.io/arumes31/whois:latest

  redis:
    extends:
      file: docker-compose.common.yml
      service: redis

networks:
  app-tier:
    driver: bridge

volumes:
  redis_data:
  whois_data:
