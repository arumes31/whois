# Published-image deployment. Service settings are inherited from the local
# Compose file so both installation paths share one security/config contract.
services:
  web:
    extends:
      file: docker-compose.yml
      service: web
    image: ghcr.io/arumes31/whois:latest
    build: null

  redis:
    extends:
      file: docker-compose.yml
      service: redis

networks:
  app-tier:
    driver: bridge

volumes:
  redis_data:
  whois_data:
