{{ template "header" . }}

<div class="narrow-page" style="max-width:800px">
    <div class="command-deck">
        <span class="command-eyebrow">OFFENSIVE MODULE</span>
        <h1 class="page-title" style="font-size:18px">Port Scanner</h1>
        <p class="page-sub" style="margin-bottom:18px">Test TCP ports on an authorized target. Presets and inclusive ranges are supported.</p>

        <form id="scanForm">
            <div class="form-field">
                <label for="scanTarget">TARGET IP OR DOMAIN</label>
                <input id="scanTarget" type="text" name="target" class="text-input" placeholder="192.168.1.1 or example.com"
                    aria-describedby="scanTargetHelp" autocomplete="off" autocapitalize="none" spellcheck="false" required>
                <div id="scanTargetHelp" class="field-help">The target is validated before any connection is attempted.</div>
            </div>
            <div class="form-field">
                <label for="scanPorts">PORTS OR PRESET</label>
                <input id="scanPorts" type="text" name="ports" class="text-input" value="common" list="scannerPortPresets"
                    aria-describedby="scanPortsHelp" autocomplete="off" spellcheck="false">
                <datalist id="scannerPortPresets"><option value="common"></option><option value="web"></option><option value="mail"></option><option value="database"></option><option value="remote"></option></datalist>
                <div id="scanPortsHelp" class="field-help">Try common, web, 22,80,443, or 8000-8010.</div>
            </div>
            <button type="submit" class="btn btn--solid" style="width:100%;justify-content:center" id="scanSubmit">INITIATE SCAN</button>
        </form>

        <div id="scanIndicator" role="status" style="display:none;margin-top:18px" class="live-log__empty">Scanning ports…</div>
        <div id="scanResults" style="margin-top:22px" aria-live="polite" aria-atomic="false"></div>
    </div>
</div>

<script>
    (function () {
        var form = document.getElementById('scanForm');
        var indicator = document.getElementById('scanIndicator');
        var results = document.getElementById('scanResults');
        var submit = document.getElementById('scanSubmit');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            indicator.style.display = 'block';
            submit.disabled = true;
            results.innerHTML = '';
            try {
                var resp = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        target: form.target.value,
                        ports: form.ports.value,
                    }),
                });
                results.innerHTML = await resp.text();
            } catch (err) {
                results.innerHTML = '<div class="alert-err">Scan request failed: ' + String(err.message || err) + '</div>';
            } finally {
                indicator.style.display = 'none';
                submit.disabled = false;
            }
        });

        // delegated copy for injected results
        results.addEventListener('click', function (event) {
            var el = event.target.closest('.clickable-record');
            if (!el) return;
            var text = el.innerText.trim();
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(function () {
                    var toast = document.getElementById('toast');
                    if (toast) { toast.classList.add('is-show'); setTimeout(function () { toast.classList.remove('is-show'); }, 1500); }
                });
            }
        });
    })();
</script>

{{ template "footer" . }}
