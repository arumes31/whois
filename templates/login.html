{{ template "header" . }}

<div class="narrow-page">
  <div class="command-deck">
    <span class="command-eyebrow">RESTRICTED CHANNEL</span>
    <h1 class="page-title" style="font-size:18px">Configuration Access</h1>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0 20px">
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ .csrf }}">
      <input type="hidden" name="next" value="{{ .next }}">
      {{ if .error }}
        <div class="alert-err" role="alert">{{ .error }}</div>
      {{ end }}
      <div class="form-field">
        <label for="username">IDENTIFIER</label>
        <input id="username" type="text" name="username" class="text-input" autocomplete="username" required autofocus>
      </div>
      <div class="form-field">
        <label for="password">PASSCODE</label>
        <input id="password" type="password" name="password" class="text-input" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn--solid" style="width:100%;justify-content:center;margin-top:8px">LOGON</button>
    </form>
  </div>
</div>

{{ template "footer" . }}
