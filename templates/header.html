{{ define "header" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{ if .config.SEOEnabled }}

    <link rel="canonical" href="{{ .config.SEODomain }}{{ .current_path }}">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ .config.SEODomain }}{{ .current_path }}">
    <meta property="og:title" content="{{ if .page_title }}{{ .page_title }}{{ else }}WHOIS Network Diagnostics{{ end }}">
    <meta property="og:description" content="Professional network reconnaissance and diagnostic toolset.">
    <meta property="og:image" content="{{ .config.SEODomain }}/static/android-chrome-512x512.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ .config.SEODomain }}{{ .current_path }}">
    <meta property="twitter:title" content="{{ if .page_title }}{{ .page_title }}{{ else }}WHOIS Network Diagnostics{{ end }}">
    <meta property="twitter:description" content="Professional network reconnaissance and diagnostic toolset.">
    <meta property="twitter:image" content="{{ .config.SEODomain }}/static/android-chrome-512x512.png">
    
    <meta name="robots" content="index, follow">
    {{ else }}
    <title>WHOIS | Network Diagnostics</title>
    <meta name="robots" content="noindex, nofollow">
    {{ end }}
    
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    
    <meta name="csrf-token" content="{{ .csrf }}">
    
    <!-- Fonts & Icons - Local Only -->
    <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="/static/vendor/prism.min.css">
    <link rel="stylesheet" href="/static/style.css">
    
    <!-- UX Enhancements Local -->
    <script src="/static/vendor/popper.min.js"></script>
    <script src="/static/vendor/tippy.min.js"></script>
    <script src="/static/vendor/chart.min.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
    
    <script src="/static/vendor/htmx.min.js"></script>
    <script>
        function fallbackCopy(text, callback) {
            if (!text) {
                console.error('No text provided to fallbackCopy');
                return;
            }
            console.log('Attempting fallback copy of:', text.substring(0, 50) + '...');
            
            const textArea = document.createElement("textarea");
            textArea.value = text;
            
            // Ensure it is in the DOM and slightly visible to satisfy some browsers
            textArea.style.position = "fixed";
            textArea.style.left = "0";
            textArea.style.top = "0";
            textArea.style.opacity = "0.01";
            textArea.style.width = "2em";
            textArea.style.height = "2em";
            textArea.style.padding = "0";
            textArea.style.border = "none";
            textArea.style.outline = "none";
            textArea.style.boxShadow = "none";
            textArea.style.background = "transparent";
            
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            let successful = false;
            try {
                successful = document.execCommand('copy');
                if (successful) {
                    console.log('execCommand copy successful');
                    if (callback) callback();
                } else {
                    console.error('execCommand copy failed');
                }
            } catch (err) {
                console.error('Fallback copy exception:', err);
            }
            
            document.body.removeChild(textArea);
            return successful;
        }

        function showCopyNotification(message = 'Copied to clipboard') {
            const banner = document.getElementById('copyBanner');
            if (!banner) return;
            const label = banner.querySelector('span');
            banner.setAttribute('aria-hidden', 'false');
            banner.classList.add('show');
            if (label) label.textContent = message;
            window.clearTimeout(window.copyBannerTimer);
            window.copyBannerTimer = window.setTimeout(() => {
                banner.classList.remove('show');
                banner.setAttribute('aria-hidden', 'true');
            }, 2000);
        }

        function copyToClipboard(el) {
            let text = el.innerText.trim();
            const strong = el.querySelector('strong');
            if (strong) {
                // Remove label and optional colon
                text = text.replace(strong.innerText, "").trim();
                if (text.startsWith(':')) text = text.substring(1).trim();
            }

            console.log('Copying record:', text);
            const onSuccess = () => {
                showCopyNotification();
                const originalBg = el.style.background;
                el.style.background = "rgba(45, 90, 39, 0.3)";
                setTimeout(() => {
                    el.style.background = originalBg;
                }, 2000);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(onSuccess).catch(err => {
                    console.warn('Clipboard API failed, using fallback:', err);
                    fallbackCopy(text, onSuccess);
                });
            } else {
                fallbackCopy(text, onSuccess);
            }
        }
    </script>
</head>
<body>

<a class="skip-link" href="#main-content">Skip to diagnostic console</a>

<div id="copyBanner" class="copy-banner" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true">
    <div class="d-flex align-items-center gap-2">
        <svg style="width:16px;height:16px;fill:currentColor" viewBox="0 0 448 512"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg>
        <span>Copied to clipboard</span>
    </div>
</div>

<div class="app-container flex-column">
    <header class="app-header" aria-label="Application header">
        <div class="container-fluid app-header__inner">
            <a class="app-brand navbar-brand fw-bold d-flex align-items-center gap-3" href="/">
                <img src="/static/android-chrome-512x512.png" alt="" width="40" height="40">
                <span class="app-brand__copy"><strong>WHOIS</strong><small>NETWORK COMMAND</small></span>
            </a>
            <div class="app-header__status">
                <span class="system-status"><span aria-hidden="true"></span>SYSTEM ONLINE</span>
                <span class="remote-ip-badge badge bg-dark border border-secondary p-2" data-tippy-content="Your current remote IP address">
                    <span class="remote-ip-badge__label">REMOTE IP</span> <strong>{{ .real_ip }}</strong>
                </span>
                <a href="/login" class="btn btn-sm btn-outline-secondary header-login" aria-label="Open configuration">
                    <svg style="width:14px;height:14px;margin-right:4px;fill:currentColor" viewBox="0 0 512 512"><path d="M217.9 105.9L340.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L217.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1L32 320c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM352 416l64 0c17.7 0 32-14.3 32-32l0-256c0-17.7-14.3-32-32-32l-64 0c-17.7 0-32-14.3-32-32s14.3-32 32-32l64 0c53 0 96 43 96 96l0 256c0 53-43 96-96 96l-64 0c-17.7 0-32-14.3-32-32s14.3-32 32-32z"/></svg> CONFIG
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content pt-0" tabindex="-1">
        <div class="container-fluid px-4">
{{ end }}
