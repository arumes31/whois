{{ define "header" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ .csrf }}">
    {{ if .config.SEOEnabled }}
    <title>{{ if .page_title }}{{ .page_title }} | {{ end }}WHOIS Network Diagnostics</title>
    <meta name="description" content="{{ if .meta_description }}{{ .meta_description }}{{ else }}Professional-grade network diagnostic platform for WHOIS, DNS, GeoIP, and security reconnaissance.{{ end }}">
    <link rel="canonical" href="{{ .config.SEODomain }}{{ .current_path }}">

    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ .config.SEODomain }}{{ .current_path }}">
    <meta property="og:title" content="{{ if .page_title }}{{ .page_title }}{{ else }}WHOIS Network Diagnostics{{ end }}">
    <meta property="og:description" content="Professional network reconnaissance and diagnostic toolset.">
    <meta property="og:image" content="{{ .config.SEODomain }}/static/android-chrome-512x512.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ .config.SEODomain }}{{ .current_path }}">
    <meta name="twitter:title" content="{{ if .page_title }}{{ .page_title }}{{ else }}WHOIS Network Diagnostics{{ end }}">
    <meta name="twitter:description" content="Professional network reconnaissance and diagnostic toolset.">
    <meta name="twitter:image" content="{{ .config.SEODomain }}/static/android-chrome-512x512.png">

    <meta name="robots" content="index, follow">
    {{ else }}
    <title>WHOIS | Network Diagnostics</title>
    <meta name="robots" content="noindex, nofollow">
    {{ end }}

    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body data-csrf-token="{{ .csrf }}">

<a class="skip-link" href="#main-content">Skip to diagnostic console</a>

<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">Copied to clipboard</div>
<div class="crt-scanlines" aria-hidden="true"></div>
<div class="crt-vignette" aria-hidden="true"></div>

<header class="app-header">
    <div class="app-header__inner">
        <a class="app-brand" href="/">
            <svg class="app-brand__mark" viewBox="0 0 32 32" aria-hidden="true">
                <path d="M2 2h8v8H2zM12 2h8v8h-8zM22 2h8v8h-8zM2 12h8v8H2zM22 12h8v8h-8zM2 22h8v8H2zM12 22h8v8h-8zM22 22h8v8h-8zM14 14h4v4h-4z"/>
            </svg>
            <span class="app-brand__copy"><strong>WHOIS</strong><small>NETWORK COMMAND</small></span>
        </a>
        <div class="app-header__status">
            <span class="system-status" id="systemStatus" role="status" aria-live="polite" aria-atomic="true">SYSTEM READY</span>
            <span class="remote-ip"><span class="remote-ip__label">REMOTE IP</span><b>{{ .real_ip }}</b></span>
            <a href="/login" class="btn btn--sm">▸ CONFIG</a>
        </div>
    </div>
</header>

<main id="main-content" tabindex="-1">
    <div class="app-shell">
{{ end }}
