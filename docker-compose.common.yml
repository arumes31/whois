# Shared runtime contract. Leaf Compose files select either a local build or a
# published image so an image-only deployment can never inherit a build rule.
services:
  web:
    ports:
      # Plain HTTP is loopback-only by default. Put an HTTPS reverse proxy in
      # front before overriding WHOIS_BIND_ADDRESS or enabling secure cookies.
      - "${WHOIS_BIND_ADDRESS:-127.0.0.1}:${WHOIS_PORT:-14400}:5000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "5000"
      CONFIG_USER: "${CONFIG_USER:?set CONFIG_USER in .env}"
      CONFIG_PASS: "${CONFIG_PASS:?set CONFIG_PASS in .env}"
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in .env}"
      TRUSTED_IPS: "${TRUSTED_IPS:-127.0.0.1,::1}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.1/32,::1/128}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      USE_CLOUDFLARE: "${USE_CLOUDFLARE:-false}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      ALLOW_DEV_CORS: "${ALLOW_DEV_CORS:-false}"
      ALLOW_PRIVATE_IPS: "${ALLOW_PRIVATE_IPS:-false}"
      ALLOW_LOOPBACK_IPS: "${ALLOW_LOOPBACK_IPS:-false}"
      ALLOW_LINK_LOCAL_IPS: "${ALLOW_LINK_LOCAL_IPS:-false}"
      ENABLE_GEO: "${ENABLE_GEO:-true}"
      AUTO_UPDATE_DATABASES: "${AUTO_UPDATE_DATABASES:-false}"
      ENABLE_SSL: "${ENABLE_SSL:-true}"
      ENABLE_WHOIS: "${ENABLE_WHOIS:-true}"
      ENABLE_DNS: "${ENABLE_DNS:-true}"
      ENABLE_CT: "${ENABLE_CT:-true}"
      ENABLE_HTTP: "${ENABLE_HTTP:-true}"
      MAXMIND_LICENSE_KEY: "${MAXMIND_LICENSE_KEY:-}"
      MAXMIND_ACCOUNT_ID: "${MAXMIND_ACCOUNT_ID:-}"
      DNS_SERVERS: "${DNS_SERVERS:-https://cloudflare-dns.com/dns-query,https://dns.google/dns-query,https://dns.quad9.net/dns-query}"
      BOOTSTRAP_DNS: "${BOOTSTRAP_DNS:-1.1.1.1,9.9.9.9}"
      DNS_MAX_ATTEMPTS: "${DNS_MAX_ATTEMPTS:-3}"
      MAX_TARGET_CONCURRENCY: "${MAX_TARGET_CONCURRENCY:-4}"
      MAX_SERVICE_CONCURRENCY: "${MAX_SERVICE_CONCURRENCY:-12}"
      PORT_SCAN_CONCURRENCY: "${PORT_SCAN_CONCURRENCY:-32}"
      PORT_SCAN_MAX_PORTS: "${PORT_SCAN_MAX_PORTS:-1024}"
      MAX_WS_CONNECTIONS: "${MAX_WS_CONNECTIONS:-128}"
      MAX_WS_CONNECTIONS_PER_IP: "${MAX_WS_CONNECTIONS_PER_IP:-8}"
      DNS_HISTORY_MAX_TARGETS: "${DNS_HISTORY_MAX_TARGETS:-1000}"
      DNS_HISTORY_TTL_HOURS: "${DNS_HISTORY_TTL_HOURS:-720}"
      SEO_ENABLED: "${SEO_ENABLED:-false}"
      SEO_DOMAIN: "${SEO_DOMAIN:-}"
      ALLOWED_DOMAIN: "${ALLOWED_DOMAIN:-}"
      WS_SKIP_ORIGIN_CHECK: "${WS_SKIP_ORIGIN_CHECK:-false}"
    restart: unless-stopped
    init: true
    read_only: true
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The provider-free ping diagnostic needs raw ICMP on hosts that do not
      # permit unprivileged ping sockets.
      - NET_RAW
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 256
        reservations:
          cpus: '0.10'
          memory: 128M
    volumes:
      - whois_data:/app/data
    networks:
      - app-tier

  redis:
    image: redis:alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    restart: unless-stopped
    init: true
    read_only: true
    pids_limit: 128
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --maxmemory
      - "${REDIS_MAXMEMORY:-192mb}"
      - --maxmemory-policy
      - "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - AUDIT_WRITE
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    stop_grace_period: 30s
    volumes:
      - redis_data:/data
    networks:
      - app-tier
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 128
