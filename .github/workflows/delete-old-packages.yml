name: Delete Old Packages

on:
  workflow_dispatch:

jobs:
  delete-versions:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'whois'
          package-type: 'container'
          # Tagged versions include releases, deployment SHA tags, latest, and test.
          # Delete only untagged versions and retain a rollback window.
          min-versions-to-keep: 10
          delete-only-untagged-versions: 'true'
