name: Build and Publish Docker Test

on:
  push:
    branches: [ "test" ]

concurrency:
  group: docker-test-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILDX_VERSION: v0.38.0
  BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  QEMU_IMAGE: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

jobs:
  quality:
    name: Full Go CI gate
    permissions:
      contents: read
    uses: ./.github/workflows/go-ci.yml

  build:
    name: Build and scan ${{ matrix.platform }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
          - platform: linux/arm64
            slug: linux-arm64
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (actions/checkout@v7)
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (actions/setup-node@v7)
        with:
          node-version: 26.11.1
          cache: npm

      - name: Verify deterministic asset build
        run: |
          npm ci --ignore-scripts
          npm test
          npm audit --audit-level=high

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4 (docker/setup-qemu-action@v4)
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4 (docker/setup-buildx-action@v4)
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4 (docker/login-action@v4)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6 (docker/metadata-action@v6)
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=test

      - name: Push architecture image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7 (docker/build-push-action@v7)
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          no-cache-filters: runtime
          cache-from: type=gha,scope=test-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=test-${{ matrix.slug }}

      - name: Verify scanned immutable image assets
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" --entrypoint /bin/sh "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" -c 'cd /app && sha256sum -c assets.sha256'

      - name: Scan immutable architecture digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (aquasecurity/trivy-action@v0)
        with:
          version: v0.75.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results-${{ matrix.slug }}.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4 (github/codeql-action@v4)
        if: ${{ always() && hashFiles(format('trivy-results-{0}.sarif', matrix.slug)) != '' }}
        with:
          sarif_file: trivy-results-${{ matrix.slug }}.sarif
          category: trivy-test-${{ matrix.slug }}

      - name: Record scanned digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM_SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${PLATFORM_SLUG}-${DIGEST#sha256:}"

      - name: Upload run-unique digest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (actions/upload-artifact@v7)
        with:
          name: test-digests-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Assemble verified test manifest
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (actions/checkout@v7)
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4 (docker/setup-buildx-action@v4)
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4 (docker/login-action@v4)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download this run's scanned digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 (actions/download-artifact@v8)
        with:
          pattern: test-digests-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Assemble manifest from scanned immutable digests
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
          TEST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
        run: |
          mapfile -t digest_files < <(find "$DIGEST_DIR" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "Expected exactly two scanned digest files, found ${#digest_files[@]}" >&2
            exit 1
          fi

          sources=()
          for file in "${digest_files[@]}"; do
            sources+=("${REGISTRY}/${IMAGE_NAME}@sha256:${file##*-}")
          done
          docker buildx imagetools create --tag "$TEST_IMAGE" "${sources[@]}"

      - name: Verify final platforms, digests, and attestations
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
          TEST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
        run: |
          bash scripts/verify-image-index.sh \
            "$TEST_IMAGE" \
            "$DIGEST_DIR" \
            "${REGISTRY}/${IMAGE_NAME}"
