name: Go CI

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches: [ test, main ]
  pull_request:
    branches: [ test, main ]

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (actions/checkout@v7)
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 (actions/setup-go@v7)
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9 (golangci/golangci-lint-action@v9)
        with:
          version: v2.13.2
      - name: Go vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (actions/checkout@v7)
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 (actions/setup-go@v7)
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests with the race detector
        run: go test -race -count=1 ./...
      - name: Run deterministic stress tests
        run: go test -race -tags=stress -count=1 -run '^TestStress' ./internal/service
      - name: Smoke-test fuzz targets
        run: |
          go test -run='^$' -fuzz=FuzzNormalizeTarget -fuzztime=10s ./internal/utils
          go test -run='^$' -fuzz=FuzzParsePortSpec -fuzztime=10s ./internal/service

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (actions/checkout@v7)
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 (actions/setup-go@v7)
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan reachable dependencies
        run: govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, vulnerability]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (actions/checkout@v7)
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 (actions/setup-go@v7)
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -trimpath -o whois-app ./cmd/server

  docker:
    name: Docker build and scan (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (actions/checkout@v7)
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (actions/setup-node@v7)
        with:
          node-version: 26.8.2
          cache: npm
      - name: Build packaged assets
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4 (docker/setup-buildx-action@v4)
        with:
          version: v0.37.0
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Assert published Compose is image-only
        env:
          CONFIG_USER: ci-user
          CONFIG_PASS: ci-password-012345
          SECRET_KEY: ci-secret-key-0123456789abcdef
          MAXMIND_LICENSE_KEY: unused-in-ci
          MAXMIND_ACCOUNT_ID: unused-in-ci
        run: |
          docker compose -f docker-compose.ghcr.yml config --format json > "${RUNNER_TEMP}/compose-ghcr.json"
          if jq -e '.services | to_entries[] | select(.value | has("build"))' "${RUNNER_TEMP}/compose-ghcr.json" >/dev/null; then
            echo "Published-image Compose configuration must not contain a build section" >&2
            exit 1
          fi
      - name: Build the runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7 (docker/build-push-action@v7)
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: whois:ci
          no-cache-filters: runtime
          cache-from: type=gha,scope=ci-${{ matrix.runner }}
          cache-to: type=gha,scope=ci-${{ matrix.runner }},mode=max
      - name: Verify final image asset manifest
        run: docker run --rm --entrypoint /bin/sh whois:ci -c 'cd /app && sha256sum -c assets.sha256'
      - name: Scan the runtime image before merge
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (aquasecurity/trivy-action@v0)
        with:
          version: v0.74.0
          image-ref: whois:ci
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
